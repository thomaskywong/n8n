services:
  - type: web
    plan: free
    # This is the runtime for services that pull a prebuilt Docker image
    runtime: image
    # You can give the service any name
    name: n8n-service
    image:
      # Pulls the n8n image tagged as latest from Docker Hub
      url: docker.io/n8nio/n8n:latest

    # All environment variables defined below are required!
    #
    # You can define additional environment variables as needed.
    envVars:
      # Security: encryption key for saved credentials
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # Database Connection (auto-linked to Render Postgres)
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user

      # Core n8n configuration
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "false"  # (set to true and add creds for production security)
      - key: N8N_HOST
        value: n8n-5w8s.onrender.com
      - key: N8N_PORT
        value: "443"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_EDITOR_URL
        value: https://n8n-5w8s.onrender.com

      # Ensure compatible Node.js version
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=4096"